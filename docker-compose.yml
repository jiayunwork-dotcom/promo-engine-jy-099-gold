version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: promo-postgres
    environment:
      POSTGRES_USER: promo
      POSTGRES_PASSWORD: promo123
      POSTGRES_DB: promo_engine
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: promo-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: promo-backend
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=promo
      - DB_PASSWORD=promo123
      - DB_NAME=promo_engine
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CACHE_TTL=300

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: promo-frontend
    ports:
      - "8082:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
